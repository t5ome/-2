const screen=document.getElementById('screen'),pin=document.getElementById('pin'),unlock=document.getElementById('unlock'),keys=document.getElementById('keys'),dots=document.getElementById('dots');let code='',isPin=false;const apps=[['Apple Store','A'],['微信','微'],['抖音','♪'],['相册','✿'],['备忘录','▤'],['日历','26'],['时钟','◷'],['微博','◉'],['淘宝','淘'],['网易云音乐','♫'],['外卖','✦'],['X','𝕏'],['YouTube','▶']];document.getElementById('grid').innerHTML=apps.map(([n,i])=>`<div class="app"><div class="ico">${i}</div>${n}</div>`).join('');for(let n=1;n<=9;n++)keys.insertAdjacentHTML('beforeend',`<button data-n="${n}">${n}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][n-1]||''}</small></button>`);keys.insertAdjacentHTML('beforeend','<span></span><button data-n="0">0</button><span></span>');function tick(){const d=new Date();const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('time').textContent=t;document.getElementById('smallTime').textContent=t;document.getElementById('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}).replace('星期','星期 ')}tick();setInterval(tick,10000);function openPin(){isPin=true;pin.classList.add('show');code='';renderDots()}function renderDots(){[...dots.children].forEach((x,i)=>x.classList.toggle('fill',i<code.length))}keys.addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;code+=b.dataset.n;renderDots();if(code.length===4){if(code==='0511'){screen.classList.remove('lock');screen.classList.add('home');pin.classList.remove('show');unlock.style.display='none';isPin=false}else{code='';renderDots();document.querySelector('.pin h2').textContent='密码错误，请重试';setTimeout(()=>document.querySelector('.pin h2').textContent='输入密码',850)}}});document.getElementById('cancel').onclick=()=>{pin.classList.remove('show');isPin=false};function gestureStart(e){window.sy=e.touches?e.touches[0].clientY:e.clientY}function gestureEnd(e){const y=e.changedTouches?e.changedTouches[0].clientY:e.clientY;if(window.sy-y>25&&!isPin&&screen.classList.contains('lock'))openPin()}screen.addEventListener('touchstart',gestureStart,{passive:true});screen.addEventListener('touchend',gestureEnd,{passive:true});screen.addEventListener('mousedown',gestureStart);screen.addEventListener('mouseup',gestureEnd);unlock.onclick=()=>openPin();screen.addEventListener('click',e=>{if(screen.classList.contains('lock')&&!isPin)openPin()});
